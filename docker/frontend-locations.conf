location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
location = /conf.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
location = /conf.json.template { return 404; }
location = /index.html {
    add_header Cache-Control "no-store" always;
}
# Missing scripts must return 404, never index.html (Unexpected token '<').
location ~ ^/v-[^/]+/ {
    try_files $uri =404;
}
location ~* \.(js|css|json|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|mp4)$ {
    try_files $uri =404;
}
location / {
    try_files $uri $uri/ /index.html;
}
